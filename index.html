<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LUNASOFT SOLID BANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --accent: #d400ff;
            /* ТЕПЕРЬ СПЛОШНОЙ ТЕМНЫЙ ЦВЕТ (НЕ ПРОЗРАЧНЫЙ) */
            --glass: #0f0f14; 
            --text: #ffffff;
        }

        html { background: transparent; }

        body {
            margin: 0;
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .levitate-wrapper {
            animation: float 6s ease-in-out infinite;
            padding: 30px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* --- БАННЕР --- */
        .banner {
            position: relative;
            width: 700px;
            height: 350px;
            background: var(--glass);
            /* Убрал блюр, так как фон теперь сплошной */
            border: 2px solid rgba(212, 0, 255, 0.3);
            border-radius: 45px;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 0 30px;
            box-sizing: border-box;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 30px 80px rgba(0,0,0,0.9),
                0 0 90px rgba(138, 43, 226, 0.25); 
            overflow: hidden;
        }

        .banner::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes shine {
            0%, 40% { left: -100%; }
            50% { left: 200%; }
            100% { left: 200%; }
        }

        .text-side {
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            text-align: center;
        }

        /* --- ЛОГО --- */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
        }

        .logo-icon {
            width: 28px; height: 28px;
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .logo-text {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #e0aaff, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            animation: gradientFlow 5s linear infinite;
        }

        h1 {
            color: #fff;
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            margin: 5px 0 0 0;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.8);
        }

        /* --- НИКНЕЙМ (БЕЛЫЕ БЛИКИ + СВЕТЛО-ФИОЛЕТОВЫЙ) --- */
        .highlight {
            font-size: 85px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff, #d4aaff, #ffffff, #d4aaff, #ffffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin: -5px 0 15px 0;
            animation: gradientFlow 3s linear infinite;
            filter: drop-shadow(0 0 25px rgba(212, 170, 255, 0.6));
        }

        @keyframes gradientFlow {
            to { background-position: 300% center; }
        }

        /* --- БЕЙДЖИ --- */
        .badges {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .badge {
            background: linear-gradient(135deg, #bd00ff, #7a00cc);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            padding: 12px 28px;
            border-radius: 18px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
        }

        .badge-icon {
            width: 20px; height: 20px;
            fill: #fff;
            display: block;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.3));
        }

        .sep { opacity: 0.4; margin: 0 5px; font-weight: 300; }

        /* --- ЖИВЫЕ ПЯТНА --- */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.45;
            animation: pulseBlob 8s ease-in-out infinite alternate;
        }
        .blob-1 { top: -80px; left: -20px; width: 450px; height: 450px; background: var(--primary); }
        .blob-2 { bottom: -80px; right: -20px; width: 450px; height: 450px; background: var(--accent); animation-delay: -4s; }

        @keyframes pulseBlob {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.1); opacity: 0.55; }
        }

    </style>
</head>
<body>

    <div class="levitate-wrapper">
        <div class="banner">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>

            <div class="text-side">
                <div class="logo-container">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <div class="logo-text">ONYX HACK</div>
                </div>

                <h1>САЙТ СОФТА:</h1>
                <span class="highlight">ONYXHACK.ORG</span>
                
                <div class="badges">
                    <div class="badge">
                        <svg class="badge-icon" viewBox="0 0 384 512">

                        </svg>
                        iOS 
                        <span class="sep">/</span>
                        <svg class="badge-icon" viewBox="0 0 576 512">
                            <path d="M420.55,301.93a24,24,0,1,1,24-24,24,24,0,0,1-24,24m-165.1,0a24,24,0,1,1,24-24,24,24,0,0,1-24,24m119.55-121.36a302.05,302.05,0,0,0-23.45-11.49l15.58-35.79a9.6,9.6,0,0,0-17.65-7.68l-15.93,36.6a287.9,287.9,0,0,0-91.1,0l-15.93-36.6a9.6,9.6,0,1,0-17.65,7.68l15.58,35.79a302.05,302.05,0,0,0-23.45,11.49A157.65,157.65,0,0,0,148,290.85V404.1a32.25,32.25,0,0,0,32.17,32.17h215.66A32.25,32.25,0,0,0,428,404.1V290.85a157.65,157.65,0,0,0-52.9-110.28"/>
                        </svg>
                        Android
                    </div>

                    <div class="badge">
                        <svg class="badge-icon" viewBox="0 0 512 512">
                            <path d="M466.5 83.7l-192-80a48.15 48.15 0 0 0-36.9 0l-192 80C27.7 91.1 16 108.6 16 128c0 198.3 114.5 335.7 221.5 380.3 11.8 4.9 25.1 4.9 36.9 0C360.1 472.6 496 349.3 496 128c0-19.4-11.7-36.9-29.5-44.3zm-47.2 114.2l-184 184c-6.2 6.2-16.4 6.2-22.6 0l-104-104c-6.2-6.2-6.2-16.4 0-22.6s16.4-6.2 22.6 0l92.7 92.7 172.7-172.7c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"/>
                        </svg>
                        БЕЗ ROOT
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
